# Zero-secret cloud build for AgentOS Waku (macOS Apple Silicon .app + Windows x86_64 ZIP + Web SPA)
name: Build AgentOS Waku (macOS & Windows)

on:
  workflow_dispatch:
    inputs:
      build_macos:
        description: "Build native macOS Apple Silicon AgentOS Waku.app"
        type: boolean
        default: true
      build_windows:
        description: "Build native Windows x86_64 portable release ZIP"
        type: boolean
        default: true
      create_draft_release:
        description: "Attach artifacts to a draft GitHub Release"
        type: boolean
        default: false
  push:
    tags:
      - "agentos-v*"

permissions:
  contents: read

concurrency:
  group: build-agentos-waku-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_VERSION: "1.96.0"

jobs:
  web-spa:
    name: Build Mobile/Web SPA
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve version from Cargo.toml
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "AgentOS Waku version: $version"

      - uses: oven-sh/setup-bun@v2

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Test & build @waku/web static SPA
        run: |
          bun --filter @waku/web test
          (cd apps/web && bun run build:spa)
          test -f apps/web/dist-spa/index.html

      - name: Upload web-dist-spa artifact
        uses: actions/upload-artifact@v7
        with:
          name: web-dist-spa
          path: apps/web/dist-spa
          if-no-files-found: error

  macos-arm64:
    name: macOS Apple Silicon (AgentOS Waku.app)
    needs: web-spa
    if: github.event_name == 'push' || inputs.build_macos
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"

      - uses: oven-sh/setup-bun@v2

      - name: Download web-dist-spa
        uses: actions/download-artifact@v8
        with:
          name: web-dist-spa
          path: apps/web/dist-spa

      - name: Cache Cargo & Waku build helpers
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            .waku-cache
          key: agentos-macos-arm64-rust-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            agentos-macos-arm64-rust-${{ env.RUST_VERSION }}-

      - name: Build & ad-hoc sign AgentOS Waku.app
        env:
          WAKU_CODESIGN_IDENTITY: "-"
          WAKU_WEB_DIST: apps/web/dist-spa
        run: |
          ./scripts/bundle.sh release
          test -d "target/release/AgentOS Waku.app"
          test -f "target/release/AgentOS Waku.app/Contents/Resources/web-dist/index.html"

      - name: Smoke-test bundled waku-daemon (--help & --mcp-stdio budget cap)
        run: |
          DAEMON="target/release/AgentOS Waku.app/Contents/MacOS/waku-daemon"
          "$DAEMON" --help
          python3 - "$DAEMON" <<'PY'
          import json, subprocess, sys, uuid
          proc = subprocess.Popen(
              [sys.argv[1], "--mcp-stdio", "--session-id", str(uuid.uuid4()), "--db", ":memory:"],
              stdin=subprocess.PIPE, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True,
          )
          def rpc(rid, method, params=None):
              msg = {"jsonrpc": "2.0", "id": rid, "method": method}
              if params is not None:
                  msg["params"] = params
              proc.stdin.write(json.dumps(msg) + "\n")
              proc.stdin.flush()
              return json.loads(proc.stdout.readline())
          rpc(1, "initialize", {"protocolVersion": "2024-11-05", "capabilities": {}, "clientInfo": {"name": "ci", "version": "1"}})
          g = json.loads(rpc(2, "tools/call", {"name": "create_goal", "arguments": {"objective": "ci", "maxTurns": 1}})["result"]["content"][0]["text"])
          rep = json.loads(rpc(3, "tools/call", {"name": "report_goal", "arguments": {"runId": g["runId"], "turnId": g["turnId"], "status": "continue", "reason": "cap"}})["result"]["content"][0]["text"])
          assert rep["status"] == "blocked" and rep["budgetExhausted"] is True and rep["turnIndex"] == 1, rep
          proc.terminate()
          proc.wait(timeout=5)
          print("OK macOS CI waku-daemon --mcp-stdio verified")
          PY

      - name: Archive AgentOS Waku.app (preserving symlinks & signatures)
        env:
          VERSION: ${{ needs.web-spa.outputs.version }}
        run: |
          mkdir -p dist
          ZIP_NAME="AgentOS-Waku-${VERSION}-aarch64-apple-darwin.zip"
          ditto -c -k --sequesterRsrc --keepParent \
            "target/release/AgentOS Waku.app" \
            "dist/${ZIP_NAME}"
          (cd dist && shasum -a 256 "${ZIP_NAME}" > "${ZIP_NAME}.sha256")
          ls -lh dist/

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: agentos-waku-macos-arm64
          path: |
            dist/AgentOS-Waku-${{ needs.web-spa.outputs.version }}-aarch64-apple-darwin.zip
            dist/AgentOS-Waku-${{ needs.web-spa.outputs.version }}-aarch64-apple-darwin.zip.sha256
          if-no-files-found: error

  windows-x86_64:
    name: Windows x86_64 (Portable Release ZIP)
    needs: web-spa
    if: github.event_name == 'push' || inputs.build_windows
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        run: |
          rustup toolchain install $env:RUST_VERSION --profile minimal
          rustup default $env:RUST_VERSION
          rustup target add x86_64-pc-windows-msvc

      - name: Download web-dist-spa
        uses: actions/download-artifact@v8
        with:
          name: web-dist-spa
          path: apps/web/dist-spa

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: agentos-windows-x86_64-rust-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            agentos-windows-x86_64-rust-${{ env.RUST_VERSION }}-

      - name: Build pure Release Windows binaries
        run: |
          cargo build --release --target x86_64-pc-windows-msvc `
            --package waku --bin waku --bin waku_js_repl `
            --package waku-daemon --bin waku-daemon `
            --package waku-computer-use --bin waku_computer_use

      - name: Smoke-test & package portable Windows ZIP
        env:
          VERSION: ${{ needs.web-spa.outputs.version }}
        run: |
          $out = "target\x86_64-pc-windows-msvc\release"
          & "$out\waku-daemon.exe" --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $pkg = "agentos-waku-$env:VERSION-x86_64-pc-windows-msvc"
          $stage = "dist\$pkg"
          if (Test-Path "dist") { Remove-Item -Recurse -Force "dist" }
          New-Item -ItemType Directory -Force -Path "$stage\resources" | Out-Null

          foreach ($exe in @("waku.exe", "waku-daemon.exe", "waku_js_repl.exe", "waku_computer_use.exe")) {
            Copy-Item "$out\$exe" "$stage\$exe"
          }
          Copy-Item "LICENSE" "$stage\LICENSE"
          Copy-Item -Recurse "apps\web\dist-spa" "$stage\resources\web-dist"

          $zipPath = "dist\$pkg.zip"
          Compress-Archive -Path $stage -DestinationPath $zipPath -Force
          $hash = (Get-FileHash -Algorithm SHA256 $zipPath).Hash.ToLowerInvariant()
          "$hash  $pkg.zip" | Out-File -Encoding ascii "$zipPath.sha256"
          Get-ChildItem dist\*.zip*

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: agentos-waku-windows-x86_64
          path: |
            dist/agentos-waku-${{ needs.web-spa.outputs.version }}-x86_64-pc-windows-msvc.zip
            dist/agentos-waku-${{ needs.web-spa.outputs.version }}-x86_64-pc-windows-msvc.zip.sha256
          if-no-files-found: error

  draft-release:
    name: Create Draft GitHub Release
    needs: [web-spa, macos-arm64, windows-x86_64]
    if: always() && (github.event_name == 'push' || inputs.create_draft_release) && needs.web-spa.result == 'success' && (needs.macos-arm64.result == 'success' || needs.windows-x86_64.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Publish draft release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          tag_name: ${{ github.event_name == 'push' && github.ref_name || format('agentos-v{0}-{1}', needs.web-spa.outputs.version, github.run_number) }}
          target_commitish: ${{ github.sha }}
          name: AgentOS Waku v${{ needs.web-spa.outputs.version }}
          files: |
            release-artifacts/*.zip
            release-artifacts/*.sha256
